name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  python-build:
    name: Build Python Package (sdist & wheel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload Python distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  docker-release:
    name: Build, Scan (Syft), Sign (Cosign) & Push Images to GHCR
    runs-on: ubuntu-latest
    needs: python-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign (Keyless Sigstore)
        uses: sigstore/cosign-installer@v3.8.1

      - name: Install Syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@v0.17.9

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Backend Image
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          target: backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract Docker metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Frontend Image
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          target: frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: Generate SBOM for Backend image
        run: |
          syft "ghcr.io/${{ github.repository }}/backend@${{ steps.build-backend.outputs.digest }}" -o spdx-json=backend-sbom.spdx.json

      - name: Generate SBOM for Frontend image
        run: |
          syft "ghcr.io/${{ github.repository }}/frontend@${{ steps.build-frontend.outputs.digest }}" -o spdx-json=frontend-sbom.spdx.json

      - name: Sign Backend Image and Attest SBOM with Cosign (Keyless)
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository }}/backend@${{ steps.build-backend.outputs.digest }}"
          cosign attest --yes --predicate backend-sbom.spdx.json --type spdxjson "ghcr.io/${{ github.repository }}/backend@${{ steps.build-backend.outputs.digest }}"

      - name: Sign Frontend Image and Attest SBOM with Cosign (Keyless)
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository }}/frontend@${{ steps.build-frontend.outputs.digest }}"
          cosign attest --yes --predicate frontend-sbom.spdx.json --type spdxjson "ghcr.io/${{ github.repository }}/frontend@${{ steps.build-frontend.outputs.digest }}"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: "*.spdx.json"

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [python-build, docker-release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Python dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          name: sbom-reports
          path: sbom

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            sbom/*
          generate_release_notes: true
