<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EdiPro — Healthcare EDI Gateway</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f5f7;
    --surface: rgba(255,255,255,0.75);
    --surface-hover: rgba(255,255,255,0.9);
    --border: rgba(0,0,0,0.08);
    --text-primary: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #86868b;
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --accent-text: #ffffff;
    --input-bg: rgba(0,0,0,0.04);
    --input-border: rgba(0,0,0,0.1);
    --input-focus: rgba(0,113,227,0.15);
    --shadow-sm: 0 2px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 24px 64px rgba(0,0,0,0.10);
    --glow: rgba(0,113,227,0.15);
    --noise: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    --pill-bg: rgba(0,0,0,0.05);
    --badge-bg: rgba(0,113,227,0.08);
    --badge-text: #0071e3;
    --divider: rgba(0,0,0,0.07);
  }

  html.dark {
    --bg: #000000;
    --surface: rgba(28,28,30,0.85);
    --surface-hover: rgba(36,36,40,0.95);
    --border: rgba(255,255,255,0.08);
    --text-primary: #f5f5f7;
    --text-secondary: #a1a1a6;
    --text-tertiary: #6e6e73;
    --accent: #2997ff;
    --accent-hover: #47a8ff;
    --accent-text: #ffffff;
    --input-bg: rgba(255,255,255,0.05);
    --input-border: rgba(255,255,255,0.1);
    --input-focus: rgba(41,151,255,0.15);
    --shadow-sm: 0 2px 12px rgba(0,0,0,0.3);
    --shadow-lg: 0 24px 64px rgba(0,0,0,0.5);
    --glow: rgba(41,151,255,0.12);
    --pill-bg: rgba(255,255,255,0.06);
    --badge-bg: rgba(41,151,255,0.12);
    --badge-text: #2997ff;
    --divider: rgba(255,255,255,0.06);
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg);
    color: var(--text-primary);
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: background-color 0.4s ease, color 0.4s ease;
    position: relative;
    overflow: hidden;
  }

  /* --- Ambient background orbs --- */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.45;
    pointer-events: none;
    transition: opacity 0.5s;
  }
  .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, #0071e3 0%, transparent 70%); top: -150px; left: -100px; animation: orb-drift 18s ease-in-out infinite alternate; }
  .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, #bf5af2 0%, transparent 70%); bottom: -100px; right: -80px; animation: orb-drift 22s ease-in-out infinite alternate-reverse; }
  .orb-3 { width: 300px; height: 300px; background: radial-gradient(circle, #30d158 0%, transparent 70%); bottom: 20%; left: 10%; opacity: 0.18; animation: orb-drift 26s ease-in-out infinite alternate; }
  html.dark .orb { opacity: 0.25; }
  @keyframes orb-drift { 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(40px,30px) scale(1.08);} }

  /* --- Dark mode toggle --- */
  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 6px 14px 6px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: var(--shadow-sm);
    transition: all 0.3s ease;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    user-select: none;
  }
  .theme-toggle:hover { background: var(--surface-hover); color: var(--text-primary); }
  .theme-toggle .material-symbols-rounded { font-size: 18px; transition: transform 0.4s ease; }
  .theme-toggle:hover .material-symbols-rounded { transform: rotate(20deg); }

  /* --- Card --- */
  .card {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 36px;
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.12);
    transition: background 0.4s ease, border-color 0.4s ease;
    animation: card-in 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes card-in { 0%{opacity:0;transform:translateY(28px) scale(0.97);} 100%{opacity:1;transform:translateY(0) scale(1);} }

  /* --- Logo --- */
  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 32px;
    text-align: center;
  }
  .logo-icon {
    width: 60px; height: 60px;
    background: linear-gradient(135deg, var(--accent) 0%, #bf5af2 100%);
    border-radius: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px var(--glow);
    transition: box-shadow 0.3s;
  }
  .logo-icon .material-symbols-rounded { font-size: 30px; color: #fff; font-variation-settings: 'FILL' 1; }
  .logo-title { font-size: 24px; font-weight: 800; letter-spacing: -0.6px; color: var(--text-primary); }
  .logo-subtitle { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-tertiary); margin-top: 2px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; background: var(--badge-bg); color: var(--badge-text); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 50px; margin-top: 8px; letter-spacing: 0.04em; }
  .badge .material-symbols-rounded { font-size: 13px; font-variation-settings: 'FILL' 1; }

  /* --- Form --- */
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px; }
  .input-wrap { position: relative; }
  .input-wrap .material-symbols-rounded { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--text-tertiary); pointer-events: none; font-variation-settings: 'FILL' 0; transition: color 0.2s; }
  input[type="email"], input[type="password"] {
    width: 100%;
    background: var(--input-bg);
    border: 1.5px solid var(--input-border);
    border-radius: 12px;
    padding: 13px 14px 13px 44px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    color: var(--text-primary);
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--input-focus); background: var(--surface-hover); }
  input:focus + .field-icon, .input-wrap:focus-within .material-symbols-rounded { color: var(--accent); }
  .label-row { display: flex; align-items: center; justify-content: space-between; }
  .forgot-link { font-size: 12px; font-weight: 600; color: var(--accent); text-decoration: none; opacity: 0.85; transition: opacity 0.2s; }
  .forgot-link:hover { opacity: 1; }
  .toggle-pw { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-tertiary); display: flex; align-items: center; transition: color 0.2s; }
  .toggle-pw:hover { color: var(--accent); }
  .toggle-pw .material-symbols-rounded { font-size: 20px; }

  /* --- Divider --- */
  .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background: var(--divider); }
  .divider span { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-tertiary); }

  /* --- Buttons --- */
  .btn-primary {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 20px var(--glow);
    margin-bottom: 12px;
  }
  .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 6px 28px var(--glow); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary .material-symbols-rounded { font-size: 18px; }

  .btn-secondary {
    width: 100%;
    padding: 13px;
    background: var(--input-bg);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
  }
  .btn-secondary:hover { background: var(--surface-hover); border-color: rgba(0,0,0,0.12); }
  .btn-secondary:active { transform: scale(0.98); }
  .btn-secondary img { width: 18px; height: 18px; }

  /* --- Footer --- */
  .card-footer { text-align: center; margin-top: 24px; }
  .card-footer p { font-size: 13px; color: var(--text-secondary); }
  .card-footer a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .card-footer a:hover { text-decoration: underline; }
  .links-row { display: flex; gap: 20px; justify-content: center; margin-top: 12px; }
  .links-row a { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-tertiary); text-decoration: none; transition: color 0.2s; }
  .links-row a:hover { color: var(--accent); }

  /* --- Version watermark --- */
  .version-mark { position: fixed; bottom: 16px; right: 20px; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-tertiary); opacity: 0.5; }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
  <span class="material-symbols-rounded" id="theme-icon">light_mode</span>
  <span id="theme-label">Light</span>
</button>

<div class="card" role="main">
  <div class="logo-wrap">
    <div class="logo-icon">
      <span class="material-symbols-rounded">hub</span>
    </div>
    <div>
      <div class="logo-title">EdiPro</div>
      <div class="logo-subtitle">Healthcare EDI Gateway</div>
    </div>
    <div class="badge">
      <span class="material-symbols-rounded">verified_user</span>
      HIPAA Compliant · Encrypted
    </div>
  </div>

  <form id="login-form" novalidate onsubmit="window.location.href='dashboard_sleek/code.html'; return false;">
    <div class="form-group">
      <label for="email">Professional Email</label>
      <div class="input-wrap">
        <span class="material-symbols-rounded">mail</span>
        <input type="email" id="email" placeholder="name@organization.com" autocomplete="email"/>
      </div>
    </div>

    <div class="form-group">
      <div class="label-row">
        <label for="password">Password</label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>
      <div class="input-wrap">
        <span class="material-symbols-rounded">lock</span>
        <input type="password" id="password" placeholder="••••••••••••" autocomplete="current-password"/>
        <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show password">
          <span class="material-symbols-rounded" id="pw-icon">visibility</span>
        </button>
      </div>
    </div>

    <div style="margin-top:24px;">
      <button type="submit" class="btn-primary">
        Sign In
        <span class="material-symbols-rounded">arrow_forward</span>
      </button>

      <div class="divider"><span>or</span></div>

      <button type="button" class="btn-secondary" onclick="window.location.href='dashboard_sleek/code.html'">
        <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Sign in with Google SSO
      </button>
    </div>
  </form>

  <div class="card-footer">
    <p>New to the portal? <a href="#">Request access →</a></p>
    <div class="links-row">
      <a href="#">HIPAA Compliance</a>
      <a href="#">Privacy Policy</a>
      <a href="#">Support</a>
    </div>
  </div>
</div>

<div class="version-mark">System v4.2.0-Alpha</div>

<script>
  const html = document.documentElement;
  const toggle = document.getElementById('theme-toggle');
  const themeIcon = document.getElementById('theme-icon');
  const themeLabel = document.getElementById('theme-label');

  const saved = localStorage.getItem('theme') || 'light';
  applyTheme(saved);

  toggle.addEventListener('click', () => {
    const next = html.classList.contains('dark') ? 'light' : 'dark';
    applyTheme(next);
    localStorage.setItem('theme', next);
  });

  function applyTheme(t) {
    html.classList.toggle('dark', t === 'dark');
    themeIcon.textContent = t === 'dark' ? 'dark_mode' : 'light_mode';
    themeLabel.textContent = t === 'dark' ? 'Dark' : 'Light';
  }

  // Password toggle
  const pwInput = document.getElementById('password');
  const pwToggle = document.getElementById('toggle-pw');
  const pwIcon = document.getElementById('pw-icon');
  pwToggle.addEventListener('click', () => {
    const isHidden = pwInput.type === 'password';
    pwInput.type = isHidden ? 'text' : 'password';
    pwIcon.textContent = isHidden ? 'visibility_off' : 'visibility';
  });
</script>
</body>
</html>
