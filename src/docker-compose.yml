services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./stitch
      dockerfile: Dockerfile
    environment:
      - VITE_API_TARGET=http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"
