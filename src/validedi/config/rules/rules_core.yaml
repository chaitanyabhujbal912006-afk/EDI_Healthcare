rules:
  # ── Envelope Validation Rules ──────────────────────────────────────────────
  - id: 'ENV-001'
    type: 'required_segment'
    target: 'ISA'
    severity: 'error'
    message: 'ISA (Interchange Control Header) segment is missing'
    suggestion: 'Every X12 EDI file must begin with an ISA segment'

  - id: 'ENV-002'
    type: 'required_segment'
    target: 'IEA'
    severity: 'error'
    message: 'IEA (Interchange Control Trailer) segment is missing'
    suggestion: 'Every X12 interchange must end with an IEA segment'

  - id: 'ENV-004'
    type: 'code_set'
    target: 'ISA15'
    allowed_values: ['T', 'P']
    severity: 'warning'
    message: 'ISA15 (Test/Production Indicator) value {value} is not standard (expected T or P)'
    suggestion: 'Use T for test transmissions, P for production'

  - id: 'ENV-005'
    type: 'regex'
    target: 'ISA12'
    pattern: '^00501'
    severity: 'warning'
    message: 'Version {value} detected. HIPAA mandates version 005010'
    suggestion: 'Update ISA12 to 00501 and GS08 to the appropriate 005010X implementation guide version'

  - id: 'ENV-006'
    type: 'required_segment'
    target: 'GS'
    severity: 'error'
    message: 'No GS (Functional Group Header) segment found'
    suggestion: 'Each interchange must contain at least one functional group'

  - id: 'ENV-007'
    type: 'paired_segments'
    segment_pair: ['GS', 'GE']
    severity: 'error'
    message: 'Functional group mismatch: {gs_count} GS segment(s) vs {ge_count} GE segment(s)'
    suggestion: 'Each GS must be paired with exactly one GE'

  - id: 'ENV-008'
    type: 'paired_segments'
    segment_pair: ['ST', 'SE']
    severity: 'error'
    message: 'Transaction set mismatch: {st_count} ST segment(s) vs {se_count} SE segment(s)'
    suggestion: 'Each ST must be paired with exactly one SE'

  # ── Control Number Validation Rules ────────────────────────────────────────
  - id: 'CTL-001'
    type: 'control_number_match'
    source: 'ISA13'
    target: 'IEA02'
    severity: 'error'
    message: 'IEA02 control number {target_value} does not match ISA13 {source_value}'
    suggestion: 'Correct IEA02 to match ISA13'

  - id: 'CTL-002'
    type: 'control_number_match'
    source: 'GS06'
    target: 'GE02'
    severity: 'error'
    message: 'GE02 control number {target_value} does not match GS06 {source_value}'
    suggestion: 'Set GE02 to match GS06'

  - id: 'CTL-003'
    type: 'control_number_match'
    source: 'ST02'
    target: 'SE02'
    severity: 'error'
    message: 'SE02 control number {target_value} does not match ST02 {source_value}'
    suggestion: 'Correct SE02 to match ST02'

  # ── Segment Count Validation Rules ─────────────────────────────────────────
  - id: 'CNT-001'
    type: 'segment_count'
    target: 'SE01'
    severity: 'error'
    message: 'SE01 segment count is {reported}, but actual count from ST to SE is {actual}'
    suggestion: 'Recount all segments from ST through SE inclusive and set SE01 to {actual}'

  - id: 'CNT-002'
    type: 'numeric_validation'
    target: 'SE01'
    severity: 'warning'
    message: 'SE01 value {value} is not a valid integer'
    suggestion: 'SE01 must be a numeric count of all segments from ST through SE inclusive'

  # ── NPI Validation ─────────────────────────────────────────────────────────
  - id: 'NPI_LUHN_2010AA'
    type: 'builtin'
    handler: 'luhn_check'
    target: 'NM109'
    loop: '2010AA'
    severity: 'error'
    message: 'NPI {value} failed Luhn algorithm check'
    suggestion: 'Verify the NPI is correct. All valid NPIs pass the Luhn check digit algorithm'

  - id: 'FORMAT_NPI_LENGTH'
    type: 'regex'
    target: 'NM109'
    loop: '2010AA'
    pattern: '^\d{10}$'
    severity: 'error'
    message: 'NPI must be exactly 10 digits, got {value}'
    suggestion: 'NPIs are always exactly 10 numeric digits'

  # ── Date Format Validation ─────────────────────────────────────────────────
  - id: 'FORMAT_CCYYMMDD_DMG'
    type: 'regex'
    target: 'DMG02'
    pattern: '^\d{8}$'
    severity: 'error'
    message: 'Date of birth must be in CCYYMMDD format (8 digits), got {value}'
    suggestion: 'Example: 19800115 for January 15, 1980'

  # ── Amount Format Validation ───────────────────────────────────────────────
  - id: 'FORMAT_AMOUNT_CLM02'
    type: 'numeric_validation'
    target: 'CLM02'
    severity: 'error'
    message: 'CLM02 value {value} is not a valid monetary amount'
    suggestion: 'CLM02 must be a numeric dollar amount (e.g., 1500.00). Remove any dollar signs, commas, or text'

  - id: 'FORMAT_AMOUNT_SV102'
    type: 'numeric_validation'
    target: 'SV102'
    severity: 'error'
    message: 'SV1 line charge {value} is not a valid numeric amount'
    suggestion: 'SV102 must be a numeric dollar amount without symbols'

  # ── ISA Fixed-Width Check ──────────────────────────────────────────────────
  - id: 'ENV-ISA-WIDTH'
    type: 'isa_fixed_width'
    target: 'ISA'
    severity: 'error'
    message: 'ISA segment is {length} characters — must be exactly 106 characters'
    suggestion: 'ISA06 and ISA08 (sender/receiver IDs) must be exactly 15 characters, padded with spaces. Short or long ISA causes delimiter misread'

  # ── Delimiter Collision Check ──────────────────────────────────────────────
  - id: 'ENV-DELIM-COLLISION'
    type: 'delimiter_collision'
    target: 'ALL'
    severity: 'error'
    message: 'Delimiter character appears inside data element {segment}{element}: {value}'
    suggestion: 'Data element values must not contain the element separator, component separator, or segment terminator characters'

  # ── Wrong ST01 for Transaction Type ───────────────────────────────────────
  - id: 'ENV-ST01-MISMATCH'
    type: 'wrong_st_code'
    target: ''
    severity: 'error'
    message: 'ST01 value {value} does not match expected transaction type {expected}'
    suggestion: 'ST01 must match the transaction type declared in GS01. Example: 835 remittance files must have ST*835, not ST*837'

  # ── Ported Rules from Legacy Backend ──────────────────────────────────────
  - id: 'SE_COUNT_MISMATCH'
    type: 'segment_count'
    target: 'SE01'
    severity: 'error'
    message: 'SE01 segment count {reported} does not match actual segment count {actual} (ST through SE inclusive).'
    suggestion: 'Recount all segments from ST through SE inclusive and set SE01 to {actual}'

  - id: 'GE_COUNT_MISMATCH'
    type: 'ge_count_match'
    severity: 'warning'
    message: 'GE01 transaction-set count does not match actual ST/SE pair count'
    suggestion: 'Ensure GE01 equals the count of ST/SE transaction set pairs in the group'

  - id: 'IEA_COUNT_MISMATCH'
    type: 'iea_count_match'
    severity: 'error'
    message: 'IEA01 functional group count {reported} does not match actual GS group count {actual}.'
    suggestion: 'Ensure IEA01 equals the count of GS/GE functional groups in the interchange'

  - id: 'FORMAT_ISA09_DATE'
    type: 'envelope_date'
    target: 'ISA09'
    severity: 'error'
    message: 'ISA09 interchange date {value} is not a valid YYMMDD calendar date'
    suggestion: 'Provide a 6-digit YYMMDD date (e.g. 230101 for Jan 1, 2023)'

  - id: 'FORMAT_ISA10_TIME'
    type: 'envelope_time'
    target: 'ISA10'
    severity: 'error'
    message: 'ISA10 interchange time {value} is not a valid HHMM time'
    suggestion: 'Provide a 4-digit HHMM time between 0000 and 2359'

  - id: 'FORMAT_GS04_DATE'
    type: 'envelope_date'
    target: 'GS04'
    severity: 'error'
    message: 'GS04 functional group date {value} is not a valid CCYYMMDD calendar date'
    suggestion: 'Provide an 8-digit CCYYMMDD date (e.g. 20230101 for Jan 1, 2023)'

  - id: 'DTP_RANGE_INVALID'
    type: 'dtp_range'
    target: 'DTP03'
    severity: 'error'
    message: 'DTP date range {value} is invalid: start date must be before or equal to end date'
    suggestion: 'For RD8 date ranges (CCYYMMDD-CCYYMMDD), end date must be on or after start date'


  - id: 'NPI_INVALID'
    type: 'builtin'
    handler: 'validate_npi_segments'
    scope: 'transaction'
    severity: 'error'
    message: 'NM109 NPI is invalid. Expected 10-digit NPI with valid check digit.'
    suggestion: 'Verify NPI passes 10-digit Luhn check digit verification'

  - id: 'ZIP_INVALID'
    type: 'regex'
    target: 'N403'
    pattern: '^\d{5}(\d{4})?$'
    severity: 'warning'
    message: 'ZIP format should be 5 or 9 digits.'
    suggestion: 'Provide a 5-digit (12345) or 9-digit (123456789) ZIP code'

  - id: 'DATE_FORMAT'
    type: 'builtin'
    handler: 'dtp_date_format_check'
    scope: 'transaction'
    severity: 'error'
    message: 'DTP date must be CCYYMMDD when DTP02 = D8.'
    suggestion: 'Format date as 8-digit CCYYMMDD'

  - id: 'AMOUNT_FORMAT'
    type: 'builtin'
    handler: 'amount_format_check'
    scope: 'transaction'
    severity: 'error'
    message: 'Amount must be numeric with up to 2 decimal places.'
    suggestion: 'Ensure amount is numeric with up to 2 decimal places'

  - id: 'QUAL_CHECKS'
    type: 'builtin'
    handler: 'qualifiers_check'
    scope: 'transaction'
    severity: 'warning'
    message: 'Qualifier validation check'
    suggestion: 'Use standard qualifiers'
